name: Validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Build (includes typecheck)
        run: npm --prefix frontend run build
      - name: Test
        run: npm --prefix frontend run test -- --watch=false

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall backend
      - name: Test
        run: python -m unittest discover -s backend/tests

  demo-flag-guard:
    name: Demo flag not leaking to prod manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan production-bound files for truthy EERO_DEMO_DATA
        run: |
          set -u
          FILES=(
            "Dockerfile"
            "docker-compose.yml"
            ".github/workflows/docker-publish.yml"
            ".github/workflows/container-sanity.yml"
          )
          PATTERN='EERO_DEMO_DATA[[:space:]]*[:=][[:space:]]*"?(true|1|yes|TRUE|YES)"?'
          fail=0
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::warning::Expected guarded file missing: $f"
              continue
            fi
            if grep -nE "$PATTERN" "$f"; then
              echo "::error file=$f::EERO_DEMO_DATA must not be enabled in production-bound manifests. Move it to docker-compose.demo.yml."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "OK — no demo flag found in production manifests."
